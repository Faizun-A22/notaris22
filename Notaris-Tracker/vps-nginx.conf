# ==============================================================================
# Template Konfigurasi Nginx untuk VPS (Ubuntu/Debian)
# Simpan file ini di: /etc/nginx/sites-available/notaris
# Lalu aktifkan dengan: sudo ln -s /etc/nginx/sites-available/notaris /etc/nginx/sites-enabled/
# ==============================================================================

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_VPS_IP; # Contoh: notaris.com atau 123.45.67.89

    # Lokasi folder hasil build di VPS Anda
    root /var/www/notaris/dist;
    index index.html index.htm;

    # Gzip Compression untuk performa cepat
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Cache static assets (gambar, css, js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
    }

    # Penanganan Single Page Application (SPA) React
    # Agar ketika reload di halaman selain / (misal /owner/dashboard) tidak 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
